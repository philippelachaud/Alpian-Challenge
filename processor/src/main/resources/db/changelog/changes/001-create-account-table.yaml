databaseChangeLog:
  - changeSet:
      id: 001-create-account-table
      author: system
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account
                    nullable: false
              - column:
                  name: iban
                  type: VARCHAR(34)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_iban
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: account
            indexName: idx_account_iban
            columns:
              - column:
                  name: iban
